<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#198754">
  <title>Olá, mundo!</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon-192.png">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: linear-gradient(145deg, #e8f5ec, #f7fbf8); color: #173b25;
      padding: 24px;
    }
    main {
      width: min(100%, 420px); text-align: center; background: white;
      padding: 38px 26px; border-radius: 24px;
      box-shadow: 0 12px 35px #174d2517;
    }
    .leaf { font-size: 54px; }
    h1 { margin: 12px 0; font-size: clamp(2rem, 8vw, 2.7rem); }
    p { color: #52665a; line-height: 1.6; }
    button {
      margin-top: 16px; border: 0; border-radius: 12px; padding: 14px 20px;
      background: #198754; color: white; font-size: 1rem; font-weight: 650;
    }
    #mensagem { min-height: 1.5em; font-weight: 600; color: #198754; }
  </style>
</head>
<body>
  <main>
    <div class="leaf" aria-hidden="true">🌱</div>
    <h1>Olá, mundo!</h1>
    <p>Meu primeiro PWA está funcionando.</p>
    <button id="botao" type="button">Clique aqui</button>
    <p id="mensagem" aria-live="polite"></p>
  </main>
  <script>
    document.querySelector("#botao").addEventListener("click", () => {
      document.querySelector("#mensagem").textContent = "Boa! O JavaScript também está funcionando.";
    });
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./service-worker.js").catch(console.error);
      });
    }
  </script>
</body>
</html>
